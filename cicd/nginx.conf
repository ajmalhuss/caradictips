# Serve the SPA: static files with a fallback to index.html for client-side routes.
# /api is routed to the backend by the ingress, so it never reaches nginx.
#
# Do NOT add an /api location that reverse-proxies to http://backend:8000 here.
# nginx resolves upstream hostnames when it loads this file, so a name that does not
# exist in the app's namespace makes nginx refuse to start and the frontend
# crash-loops. For local dev use `npm run dev` (Vite proxies /api instead).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets are content-hashed by Vite — cache them hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Web app manifest. nginx's mime.types has no entry for .webmanifest, so it falls
    # back to application/octet-stream — and Chrome refuses to treat that as a manifest,
    # which silently makes the app non-installable (no error in the UI, just no prompt).
    # The type must be application/manifest+json.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # The service worker must never be cached: a stale copy keeps serving an old
    # cache version after a deploy. Browsers also cap SW scope by its path, so it has
    # to stay at the root.
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}