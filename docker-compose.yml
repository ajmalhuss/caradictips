# Local development ONLY — not part of the deploy. In production the platform
# provisions an OceanBase database and runs Flyway itself; uploads never use this
# file.
#
# OceanBase speaks the MySQL wire protocol, so a local MySQL container is a faithful
# stand-in: the same `asyncmy` driver, the same `%s` placeholders, and the *same*
# Flyway migrations all run unchanged. SQLite is NOT a drop-in.
#
#   docker compose up -d db && docker compose run --rm migrate
#   cd backend && DATABASE_URL="mysql://root:root@localhost:3306/app" uvicorn main:app --reload
#   cd frontend && npm install && npm run dev
services:
  db:
    # Pinned to 8.0: mysql:8 now resolves to 8.4+, whose caching_sha2_password
    # handshake makes Flyway 10 retry forever ("serverRsaPublicKeyFile not set")
    # instead of failing.
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - dbdata:/var/lib/mysql

  # One-shot: applies backend/resources/db/migration/V*.sql, same as the platform.
  migrate:
    image: flyway/flyway:10
    command: >
      -url=jdbc:mysql://db:3306/app?allowPublicKeyRetrieval=true
      -user=root -password=root
      -connectRetries=30
      -locations=filesystem:/flyway/sql
      migrate
    volumes:
      - ./backend/resources/db/migration:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata: